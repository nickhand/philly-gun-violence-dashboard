version: 2

updates:
  - package-ecosystem: "uv"
    directories:
      - "/packages/api"
      - "/packages/aws-batch-scraper"
      - "/packages/dashboard-utils"
      - "/packages/etl"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directories:
      - "/packages/api"
      - "/packages/etl"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
