version: 2

# Weekly minor/patch batches merge after the protected CI and policy gates.
# Cooldowns and PR limits apply to version updates, not security updates.
# See docs/dependency-maintenance.md for the review and auto-merge policy.
updates:
  - package-ecosystem: "uv"
    directories:
      - "/packages/api"
      - "/packages/aws-batch-scraper"
      - "/packages/dashboard-utils"
      - "/packages/etl"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    # Avoid rewriting shared-package requirements already satisfied by an update.
    versioning-strategy: increase-if-necessary
    # Version updates only: security fixes may still propose a major release.
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    # Version updates only: security fixes may still propose a major release.
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    cooldown:
      default-days: 7
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories:
      - "/packages/api"
      - "/packages/etl"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    # Version updates only: security fixes may still propose a major release.
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
        # Review each base image separately, keeping shared pins aligned.
        group-by: "dependency-name"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    # Version updates only: security fixes may still propose a major release.
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
