name: Daily Homicide ETL

on:
  workflow_dispatch:

concurrency:
  group: daily-homicide-sync
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  daily-sync-homicides:
    name: Daily Homicides Data Sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Update pip certificate bundle
        run: uv pip install --no-config --exclude-newer-package "pip=0 days" --python "$(python -c 'import sys; print(sys.executable)')" "pip==26.2.2"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - name: Install exact Google Chrome release
        run: |
          set -euo pipefail
          chrome_lock="packages/etl/chrome-lock.json"
          chrome_repository="$(jq -er '.source.repository' "${chrome_lock}")"
          chrome_filename="$(jq -er '.package.filename' "${chrome_lock}")"
          chrome_package_sha256="$(jq -er '.package.sha256' "${chrome_lock}")"
          chrome_package_version="$(jq -er '.package.version' "${chrome_lock}")"
          chrome_product_version="$(jq -er '.package.product_version' "${chrome_lock}")"
          chrome_executable_path="$(jq -er '.executable.path' "${chrome_lock}")"
          chrome_executable_sha256="$(jq -er '.executable.sha256' "${chrome_lock}")"
          chrome_deb="${RUNNER_TEMP}/google-chrome-stable.deb"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --max-time 120 \
            --output "${chrome_deb}" \
            "${chrome_repository}/${chrome_filename}"
          printf '%s  %s\n' \
            "${chrome_package_sha256}" \
            "${chrome_deb}" | sha256sum --check --strict
          sudo apt-get install --yes --reinstall --no-install-recommends \
            --allow-downgrades "${chrome_deb}"
          test "$(dpkg-query --show --showformat='${Version}' google-chrome-stable)" = \
            "${chrome_package_version}"
          test "$(google-chrome --product-version)" = "${chrome_product_version}"
          printf '%s  %s\n' \
            "${chrome_executable_sha256}" \
            "${chrome_executable_path}" | sha256sum --check --strict
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/trusted.gpg.d/google-chrome.gpg \
            /etc/cron.daily/google-chrome \
            /etc/default/google-chrome \
            /usr/share/keyrings/google-linux-signing-keyring.gpg
          sudo rm -rf /opt/google/chrome/cron
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::985454606291:role/gha-ujs-scraper
          aws-region: us-east-1
      - name: Verify identity
        run: aws sts get-caller-identity
      - name: Run homicides ETL
        run: just etl-homicides
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_SCRAPER_PREFIX: ${{ vars.S3_SCRAPER_PREFIX }}
          S3_PROCESSED_PREFIX: ${{ vars.S3_PROCESSED_PREFIX }}
          S3_REFERENCE_PREFIX: ${{ vars.S3_REFERENCE_PREFIX }}
      # Transitional compatibility only. Remove after the pointer-aware API is
      # deployed and has successfully refreshed from a committed release.
      - name: Restart legacy Fly API
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - run: just fly-restart
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
