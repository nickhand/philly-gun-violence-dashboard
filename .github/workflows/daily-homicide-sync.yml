name: Daily Homicide ETL

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  daily-sync-homicides:
    name: Daily Homicides Data Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::985454606291:role/gha-ujs-scraper
          aws-region: us-east-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v4
      - uses: taiki-e/install-action@just
      - name: Verify identity
        run: aws sts get-caller-identity
      - name: Install Playwright Chromium
        run: uv run --project etl playwright install chromium --with-deps
      - name: Run homicides ETL
        run: just etl-homicides
      - name: Restart Fly API
        uses: superfly/flyctl-actions/setup-flyctl@master
      - run: just fly-restart
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
