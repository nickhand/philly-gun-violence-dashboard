name: Daily Homicide ETL

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  daily-sync-homicides:
    name: Daily Homicides Data Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::985454606291:role/gha-ujs-scraper
          aws-region: us-east-1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.0"
      - uses: taiki-e/install-action@just
      - name: Verify identity
        run: aws sts get-caller-identity
      - name: Install Playwright Chromium
        run: uv run --project packages/etl playwright install chromium --with-deps
      - name: Run homicides ETL
        run: just etl-homicides
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_SCRAPER_PREFIX: ${{ vars.S3_SCRAPER_PREFIX }}
          S3_PROCESSED_PREFIX: ${{ vars.S3_PROCESSED_PREFIX }}
          S3_REFERENCE_PREFIX: ${{ vars.S3_REFERENCE_PREFIX }}
      - name: Restart Fly API
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - run: just fly-restart
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
