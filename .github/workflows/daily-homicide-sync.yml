name: Daily Homicide ETL

on:
  workflow_dispatch:

concurrency:
  group: daily-homicide-sync
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  daily-sync-homicides:
    name: Daily Homicides Data Sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.0"
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      - name: Verify pinned Chrome is still the signed stable release
        run: python3 packages/etl/src/etl/chrome_release.py
      - name: Install exact Google Chrome release
        run: |
          chrome_deb="${RUNNER_TEMP}/google-chrome-stable.deb"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --max-time 120 \
            --output "${chrome_deb}" \
            https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_151.0.7922.173-1_amd64.deb
          printf '%s  %s\n' \
            '878e5ab495b8a694980fca61bc09b37e651ccedce2291c73434d16e48a2646fd' \
            "${chrome_deb}" | sha256sum --check --strict
          sudo apt-get install --yes --no-install-recommends --allow-downgrades "${chrome_deb}"
          test "$(dpkg-query --show --showformat='${Version}' google-chrome-stable)" = \
            '151.0.7922.173-1'
          test "$(google-chrome --product-version)" = '151.0.7922.173'
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/trusted.gpg.d/google-chrome.gpg \
            /etc/cron.daily/google-chrome \
            /etc/default/google-chrome \
            /usr/share/keyrings/google-linux-signing-keyring.gpg
          sudo rm -rf /opt/google/chrome/cron
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::985454606291:role/gha-ujs-scraper
          aws-region: us-east-1
      - name: Verify identity
        run: aws sts get-caller-identity
      - name: Run homicides ETL
        run: just etl-homicides
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_SCRAPER_PREFIX: ${{ vars.S3_SCRAPER_PREFIX }}
          S3_PROCESSED_PREFIX: ${{ vars.S3_PROCESSED_PREFIX }}
          S3_REFERENCE_PREFIX: ${{ vars.S3_REFERENCE_PREFIX }}
      # Transitional compatibility only. Remove after the pointer-aware API is
      # deployed and has successfully refreshed from a committed release.
      - name: Restart legacy Fly API
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - run: just fly-restart
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
