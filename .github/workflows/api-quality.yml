name: API quality

on:
  pull_request:
    paths:
      - "packages/api/**"
      - "packages/dashboard-utils/**"
      - ".dockerignore"
      - "justfile"
      - "just/python.just"
      - "ty.toml"
      - ".github/workflows/api-quality.yml"
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/dashboard-utils/**"
      - ".dockerignore"
      - "justfile"
      - "just/python.just"
      - "ty.toml"
      - ".github/workflows/api-quality.yml"

concurrency:
  group: api-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API tests, static checks, and image smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.0"
      - name: Ruff lint
        run: uv run --group dev ruff check app scripts
      - name: Ruff format
        run: uv run --group dev ruff format --check app scripts
      - name: ty
        run: uv run --group dev ty check --config-file ../../ty.toml --error-on-warning --output-format github app
      - name: Tests
        run: uv run --group dev pytest tests
      - name: Build production image
        working-directory: .
        run: docker build --file packages/api/Dockerfile --tag philly-gun-violence-api:ci .
      - name: Smoke-test production image
        working-directory: .
        run: >-
          docker run --rm
          --env ENV=prod
          --env AWS_BUCKET_NAME=ci-smoke
          --env AWS_REGION=us-east-1
          philly-gun-violence-api:ci
          python -c
          "from app.main import app; paths = {route.path for route in app.routes}; assert {'/health', '/stats.json'} <= paths"
