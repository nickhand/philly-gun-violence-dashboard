name: API quality

on:
  pull_request:
    paths:
      - "packages/api/**"
      - "packages/dashboard-utils/**"
      - ".dockerignore"
      - "ruff.toml"
      - "ty.toml"
      - "uv.toml"
      - ".github/workflows/api-quality.yml"
      - ".github/ci/scope.py"
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/dashboard-utils/**"
      - ".dockerignore"
      - "ruff.toml"
      - "ty.toml"
      - "uv.toml"
      - ".github/workflows/api-quality.yml"
      - ".github/ci/scope.py"

concurrency:
  group: api-quality-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Route API quality jobs
    runs-on: ubuntu-24.04
    outputs:
      checks: ${{ steps.scope.outputs.checks }}
      image: ${{ steps.scope.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/ci/scope.py \
            --workflow api \
            --event "${GITHUB_EVENT_NAME}" \
            --before "${BEFORE_SHA}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  test:
    name: API tests and static checks
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"
      - name: Ruff lint
        run: uv run --group dev ruff check app scripts tests
      - name: Ruff format
        run: uv run --group dev ruff format --check app scripts tests
      - name: ty
        run: uv run --group dev ty check --config-file ../../ty.toml --error-on-warning --output-format github app scripts
      - name: Tests
        run: uv run --group dev pytest tests

  image:
    name: API production image smoke
    needs: [changes, test]
    if: >-
      always() &&
      needs.changes.outputs.image == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build --file packages/api/Dockerfile --tag philly-gun-violence-api:ci .
      - name: Smoke-test production image
        run: |
          test "$(docker inspect --format '{{.Config.User}}' philly-gun-violence-api:ci)" = "app"
          docker run --rm \
            --env ENV=prod \
            --env AWS_BUCKET_NAME=ci-smoke \
            --env AWS_REGION=us-east-1 \
            philly-gun-violence-api:ci \
            python -c "import os; from app.main import app; paths = set(app.openapi()['paths']); assert {'/health', '/ready', '/stats.json'} <= paths; assert not os.access('/app/api', os.W_OK); assert not os.access('/app/.venv', os.W_OK)"

  gate:
    name: API quality gate
    needs: [changes, test, image]
    if: always()
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      CHECKS_SELECTED: ${{ needs.changes.outputs.checks }}
      IMAGE_SELECTED: ${{ needs.changes.outputs.image }}
      TEST_RESULT: ${{ needs.test.result }}
      IMAGE_RESULT: ${{ needs.image.result }}
    steps:
      - name: Require every selected job to pass
        run: |
          test "${CHANGES_RESULT}" = "success"
          require_routed_job() {
            case "$1" in
              true) test "$2" = "success" ;;
              false) test "$2" = "skipped" ;;
              *) echo "Invalid $3 selector: $1" >&2; exit 1 ;;
            esac
          }
          require_routed_job "${CHECKS_SELECTED}" "${TEST_RESULT}" "checks"
          require_routed_job "${IMAGE_SELECTED}" "${IMAGE_RESULT}" "image"
