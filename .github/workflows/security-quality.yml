name: Dependency security quality

on:
  # Emit a final gate on every PR; job routing keeps unrelated changes cheap.
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/api/pyproject.toml"
      - "packages/api/uv.lock"
      - "packages/etl/pyproject.toml"
      - "packages/etl/uv.lock"
      - "packages/dashboard-utils/pyproject.toml"
      - "packages/dashboard-utils/uv.lock"
      - "packages/aws-batch-scraper/pyproject.toml"
      - "packages/aws-batch-scraper/uv.lock"
      - "frontend/package-lock.json"
      - "frontend/package.json"
      - "frontend/vendor/**"
      - "uv.toml"
      - ".github/workflows/security-quality.yml"
      - ".github/ci/scope.py"
  workflow_dispatch:
    inputs:
      full_audit:
        description: Also run the weekly dependency audits and clean image build today
        type: boolean
        default: false

concurrency:
  group: security-quality-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      actions: read
    name: Route dependency audits
    runs-on: ubuntu-24.04
    outputs:
      deployed: ${{ steps.cadence.outputs.deployed }}
      image: ${{ steps.cadence.outputs.image }}
      api: ${{ steps.scope.outputs.api }}
      etl: ${{ steps.scope.outputs.etl }}
      dashboard: ${{ steps.scope.outputs.dashboard }}
      scraper: ${{ steps.scope.outputs.scraper }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select daily monitoring and weekly clean builds
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_AUDIT: ${{ inputs.full_audit || false }}
        run: |
          set -euo pipefail
          deployed=false
          image=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            image=true
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              deployed=true
              # Keep the original Wednesday selection when re-running an old job.
              created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
              weekday=$(date -u -d "${created:?Missing GitHub run creation time}" +%u)
              if [[ "$FULL_AUDIT" != true && "$weekday" != 3 ]]; then
                image=false
              fi
            fi
          fi
          printf 'deployed=%s\nimage=%s\n' "$deployed" "$image" >> "$GITHUB_OUTPUT"
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ steps.cadence.outputs.deployed }}" == true && "${{ steps.cadence.outputs.image }}" == false ]]; then
            printf '%s=false\n' api etl dashboard scraper frontend >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python3 .github/ci/scope.py \
            --workflow security \
            --event "${GITHUB_EVENT_NAME}" \
            --before "${BEFORE_SHA}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  api:
    name: API production dependency audit
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Update pip certificate bundle
        run: uv pip install --no-config --exclude-newer-package "pip=0 days" --python "$(python -c 'import sys; print(sys.executable)')" "pip==26.2.2"
      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-local --output-file "${RUNNER_TEMP}/api-requirements.txt"
          uvx --exclude-newer-package "certifi=0 days" --exclude-newer-package "pip=0 days" --with "certifi>=2026.10.23" --with "pip==26.2.2" --from "pip-audit==2.10.1" pip-audit --requirement "${RUNNER_TEMP}/api-requirements.txt" --disable-pip --progress-spinner off --strict --timeout 60

  etl:
    name: ETL production dependency audit
    needs: changes
    if: needs.changes.outputs.etl == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/etl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Update pip certificate bundle
        run: uv pip install --no-config --exclude-newer-package "pip=0 days" --python "$(python -c 'import sys; print(sys.executable)')" "pip==26.2.2"
      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-local --output-file "${RUNNER_TEMP}/etl-requirements.txt"
          uvx --exclude-newer-package "certifi=0 days" --exclude-newer-package "pip=0 days" --with "certifi>=2026.10.23" --with "pip==26.2.2" --from "pip-audit==2.10.1" pip-audit --requirement "${RUNNER_TEMP}/etl-requirements.txt" --disable-pip --progress-spinner off --strict --timeout 60

  dashboard:
    name: Dashboard utilities production dependency audit
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/dashboard-utils
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Update pip certificate bundle
        run: uv pip install --no-config --exclude-newer-package "pip=0 days" --python "$(python -c 'import sys; print(sys.executable)')" "pip==26.2.2"
      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-local --output-file "${RUNNER_TEMP}/dashboard-requirements.txt"
          uvx --exclude-newer-package "certifi=0 days" --exclude-newer-package "pip=0 days" --with "certifi>=2026.10.23" --with "pip==26.2.2" --from "pip-audit==2.10.1" pip-audit --requirement "${RUNNER_TEMP}/dashboard-requirements.txt" --disable-pip --progress-spinner off --strict --timeout 60

  scraper:
    name: AWS Batch scraper production dependency audit
    needs: changes
    if: needs.changes.outputs.scraper == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/aws-batch-scraper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Update pip certificate bundle
        run: uv pip install --no-config --exclude-newer-package "pip=0 days" --python "$(python -c 'import sys; print(sys.executable)')" "pip==26.2.2"
      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-local --output-file "${RUNNER_TEMP}/scraper-requirements.txt"
          uvx --exclude-newer-package "certifi=0 days" --exclude-newer-package "pip=0 days" --with "certifi>=2026.10.23" --with "pip==26.2.2" --from "pip-audit==2.10.1" pip-audit --requirement "${RUNNER_TEMP}/scraper-requirements.txt" --disable-pip --progress-spinner off --strict --timeout 60

  frontend:
    name: Frontend production dependency audit
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: npm install --global npm@11.18.0
      - run: npm ci --ignore-scripts
      - run: npm run test:dependency-security
      - run: npm run audit:dependencies

  image:
    name: Clean scraper image security audit
    needs: changes
    if: needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/scraper-image-quality.yml

  gate:
    name: Dependency security gate
    needs: [changes, api, etl, dashboard, scraper, frontend, image]
    # The daily production observation reports through its own jobs. This gate
    # certifies candidate audits only, including failed routing on any event.
    if: >-
      always() && (needs.changes.result != 'success' ||
      needs.changes.outputs.deployed != 'true' || needs.changes.outputs.image == 'true')
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      API_SELECTED: ${{ needs.changes.outputs.api }}
      ETL_SELECTED: ${{ needs.changes.outputs.etl }}
      DASHBOARD_SELECTED: ${{ needs.changes.outputs.dashboard }}
      SCRAPER_SELECTED: ${{ needs.changes.outputs.scraper }}
      IMAGE_SELECTED: ${{ needs.changes.outputs.image }}
      IMAGE_RESULT: ${{ needs.image.result }}
      FRONTEND_SELECTED: ${{ needs.changes.outputs.frontend }}
      API_RESULT: ${{ needs.api.result }}
      ETL_RESULT: ${{ needs.etl.result }}
      DASHBOARD_RESULT: ${{ needs.dashboard.result }}
      SCRAPER_RESULT: ${{ needs.scraper.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
    steps:
      - name: Require every selected audit to pass
        run: |
          test "${CHANGES_RESULT}" = "success"
          require_routed_job() {
            case "$1" in
              true) test "$2" = "success" ;;
              false) test "$2" = "skipped" ;;
              *) echo "Invalid $3 selector: $1" >&2; exit 1 ;;
            esac
          }
          require_routed_job "${API_SELECTED}" "${API_RESULT}" "api"
          require_routed_job "${ETL_SELECTED}" "${ETL_RESULT}" "etl"
          require_routed_job "${DASHBOARD_SELECTED}" "${DASHBOARD_RESULT}" "dashboard"
          require_routed_job "${SCRAPER_SELECTED}" "${SCRAPER_RESULT}" "scraper"
          require_routed_job "${FRONTEND_SELECTED}" "${FRONTEND_RESULT}" "frontend"
          require_routed_job "${IMAGE_SELECTED}" "${IMAGE_RESULT}" "image"

  deployed:
    name: Daily deployed scraper audit
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deployed == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
      issues: write
    uses: ./.github/workflows/deployed-scraper-audit.yml

  weekly-review:
    name: Track unresolved maintenance work
    needs: [changes, api, etl, dashboard, scraper, frontend, image]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deployed == 'true' &&
      needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    concurrency:
      group: weekly-security-issues
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update the weekly review queue
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RESULTS: >-
            {"api":"${{ needs.api.result }}","etl":"${{ needs.etl.result }}",
             "dashboard":"${{ needs.dashboard.result }}","scraper":"${{ needs.scraper.result }}",
             "frontend":"${{ needs.frontend.result }}","image":"${{ needs.image.result }}"}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            python3 .github/ci/security_issues.py weekly
          else
            echo 'Main advanced during this audit. Preserving the weekly queue.' >> "$GITHUB_STEP_SUMMARY"
          fi
