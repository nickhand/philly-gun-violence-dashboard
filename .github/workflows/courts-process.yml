name: Courts publication
run-name: Courts publication — ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Scraper run ID whose lease should be completed, if applicable."
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: courts-production
  cancel-in-progress: false
  queue: max

jobs:
  courts-process:
    name: Process courts scraper results
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::985454606291:role/gha-ujs-scraper
          aws-region: us-east-1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Update pip certificate bundle
        run: uv pip install --no-config --exclude-newer-package "pip=0 days" --python "$(python -c 'import sys; print(sys.executable)')" "pip==26.2.2"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just
      - name: Process results
        run: just etl-courts-process
        env:
          ENV: prod
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          RUN_ID: ${{ inputs.run_id }}

  publish:
    needs: courts-process
    uses: ./.github/workflows/daily-shootings-sync.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  verify-publication:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify this exact court run is public
        env:
          EXPECTED_RUN_ID: ${{ inputs.run_id }}
        run: python3 .github/ci/check_courts_freshness.py --api-base-url https://philly-gun-violence-dashboard-api.fly.dev --expected-run-id "$EXPECTED_RUN_ID"
