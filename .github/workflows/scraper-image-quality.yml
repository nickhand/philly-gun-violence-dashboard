name: Scraper production image quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    name: Build, smoke-test, and audit scraper image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.12.0"
      - name: Verify generated Chrome pin consumers
        working-directory: packages/etl
        run: uv run python scripts/render_chrome_lock.py --check
      - name: Build production scraper image
        # Keep slow but progressing snapshot downloads within a bounded build.
        timeout-minutes: 90
        run: python .github/ci/build_scraper_image.py
      - name: Smoke-test production scraper image
        run: bash .github/ci/smoke_scraper_image.sh philly-courts-scraper:ci
      - name: Generate SBOMs and scan the exact production image
        working-directory: packages/aws-batch-scraper
        run: |
          set -euo pipefail
          chrome_lock="${GITHUB_WORKSPACE}/packages/etl/chrome-lock.json"
          chrome_package_version="$(jq -er '.package.version' "${chrome_lock}")"
          chrome_executable_sha256="$(jq -er '.executable.sha256' "${chrome_lock}")"
          uv run aws-batch-scraper-release-image scan-local-image \
            --image philly-courts-scraper:ci \
            --expected-distro-name ubuntu \
            --expected-distro-version 26.04 \
            --required-packages "python:playwright=1.63.0,deb:google-chrome-stable=${chrome_package_version},deb:libcurl3t64-gnutls=8.18.0-1ubuntu2.8,deb:libx11-6=2:1.8.13-1ubuntu0.1,deb:librsvg2-2=2.61.3+dfsg-3ubuntu0.1,deb:libpng16-16t64=1.6.57-1ubuntu0.1,deb:libaom3=3.13.1-2ubuntu0.1,deb:bubblewrap=0.12.0-0philly1,binary:node=24.21.0" \
            --required-chrome-executable-sha256 "sha256:${chrome_executable_sha256}" \
            --forbid-chrome-sandbox \
            --forbid-setuid-setgid-files \
            --output-directory "${RUNNER_TEMP}/scraper-image-scan"
      - name: Preserve scraper SBOM and vulnerability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scraper-image-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scraper-image-scan
          if-no-files-found: ignore
          retention-days: 30
