name: Deployed scraper security monitor

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deployed-scraper-security
  cancel-in-progress: false

jobs:
  scan:
    name: Observe the active production image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      observation_id: ${{ steps.observation.outputs.artifact-id }}
      observed: ${{ steps.scan.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - run: uv sync --project packages/etl --frozen --no-dev
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::985454606291:role/gha-ujs-deployer
          aws-region: us-east-1
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::philly-gun-violence-dashboard/ujs-scraper/deployment/active.json"},
              {"Effect":"Allow","Action":"ecr:GetAuthorizationToken","Resource":"*"},
              {"Effect":"Allow","Action":["ecr:BatchGetImage","ecr:DescribeImageScanFindings","ecr:BatchCheckLayerAvailability","ecr:GetDownloadUrlForLayer"],"Resource":"arn:aws:ecr:us-east-1:985454606291:repository/ujs-scraper"}
            ]}
      - name: Scan with current vulnerability data
        id: scan
        continue-on-error: true
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          COURTS_RELEASE_KEY: ${{ vars.COURTS_RELEASE_KEY }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com"
          packages/etl/.venv/bin/python packages/etl/scripts/scan_deployed_scraper.py "${RUNNER_TEMP}/evidence" "${RUNNER_TEMP}/observation.json"
      - name: Record incomplete coverage
        if: steps.scan.outcome == 'failure'
        run: |
          echo '::warning::Scan incomplete. Existing findings stay open. The coverage watchdog tracks the last verified observation.'
          echo 'The scanner could not verify the deployed image. See the scan diagnostics.' >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deployed-scraper-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.scan.outcome == 'success'
        id: observation
        with:
          name: scan-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation.json
          if-no-files-found: error
          retention-days: 7

  reconcile:
    name: Record verified production findings
    needs: scan
    if: needs.scan.outputs.observed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.scan.outputs.observation_id }}
          path: ${{ runner.temp }}/verified
          merge-multiple: true
      - name: Reconcile actionable findings
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_MAINTAINER: ${{ vars.SECURITY_MAINTAINER || github.repository_owner }}
        run: python3 .github/ci/security_issues.py deployed "${RUNNER_TEMP}/verified/observation.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-deployed-scraper-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified/observation.json
          if-no-files-found: error
          retention-days: 30
