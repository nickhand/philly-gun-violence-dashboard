name: ETL quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/etl/**"
      - "packages/dashboard-utils/**"
      - "packages/aws-batch-scraper/**"
      - ".dockerignore"
      - "Justfile"
      - "ruff.toml"
      - "ty.toml"
      - "uv.toml"
      - ".github/workflows/chrome-update.yml"
      - ".github/workflows/daily-homicide-sync.yml"
      - ".github/workflows/etl-quality.yml"
      - ".github/workflows/production-smoke.yml"
      - ".github/ci/scope.py"
  push:
    branches: [main]
    paths:
      - "packages/etl/**"
      - "packages/dashboard-utils/**"
      - "packages/aws-batch-scraper/**"
      - ".dockerignore"
      - "Justfile"
      - "ruff.toml"
      - "ty.toml"
      - "uv.toml"
      - ".github/workflows/chrome-update.yml"
      - ".github/workflows/daily-homicide-sync.yml"
      - ".github/workflows/etl-quality.yml"
      - ".github/workflows/production-smoke.yml"
      - ".github/ci/scope.py"

concurrency:
  group: etl-quality-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Route ETL quality jobs
    runs-on: ubuntu-24.04
    outputs:
      etl: ${{ steps.scope.outputs.etl }}
      dashboard: ${{ steps.scope.outputs.dashboard }}
      scraper: ${{ steps.scope.outputs.scraper }}
      image: ${{ steps.scope.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/ci/scope.py \
            --workflow etl \
            --event "${GITHUB_EVENT_NAME}" \
            --before "${BEFORE_SHA}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  etl:
    name: ETL tests and static checks
    needs: changes
    if: needs.changes.outputs.etl == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/etl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"
      - name: Ruff lint
        run: uv run --group dev ruff check src tests scripts
      - name: Ruff format
        run: uv run --group dev ruff format --check src tests scripts
      - name: ty
        run: uv run --group dev ty check --config-file ../../ty.toml --error-on-warning --output-format github src scripts
      - name: Tests
        run: uv run --group dev pytest tests

  dashboard:
    name: Dashboard utilities tests and static checks
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/dashboard-utils
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"
      - name: Ruff lint
        run: uv run --group dev ruff check src tests
      - name: Ruff format
        run: uv run --group dev ruff format --check src tests
      - name: ty
        run: uv run --group dev ty check --config-file ../../ty.toml --error-on-warning --output-format github src
      - name: Tests
        run: uv run --group dev pytest tests

  scraper:
    name: AWS Batch scraper tests and static checks
    needs: changes
    if: needs.changes.outputs.scraper == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/aws-batch-scraper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"
      - name: Ruff lint
        run: uv run --group dev ruff check src tests
      - name: Ruff format
        run: uv run --group dev ruff format --check src tests
      - name: ty
        run: uv run --group dev ty check --config-file ../../ty.toml --error-on-warning --output-format github src
      - name: Tests
        run: uv run --group dev pytest tests

  image:
    name: Scraper production image smoke and scan
    needs: [changes, etl, dashboard, scraper]
    if: >-
      always() &&
      needs.changes.outputs.image == 'true' &&
      (needs.etl.result == 'success' || needs.etl.result == 'skipped') &&
      (needs.dashboard.result == 'success' || needs.dashboard.result == 'skipped') &&
      (needs.scraper.result == 'success' || needs.scraper.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"
      - name: Verify generated Chrome pin consumers
        working-directory: packages/etl
        run: uv run python scripts/render_chrome_lock.py --check
      - name: Build production scraper image
        run: docker build --file packages/etl/Dockerfile --tag philly-courts-scraper:ci .
      - name: Smoke-test production scraper image
        run: |
          set -euo pipefail
          chrome_product_version="$(jq -er '.package.product_version' packages/etl/chrome-lock.json)"
          test "$(docker inspect --format '{{.Config.User}}' philly-courts-scraper:ci)" = "app"
          test "$(docker inspect --format '{{json .Config.Cmd}}' philly-courts-scraper:ci)" = '["gv-dashboard-etl","courts","worker"]'
          image_entrypoint="$(docker inspect --format '{{json .Config.Entrypoint}}' philly-courts-scraper:ci)"
          test "${image_entrypoint}" = "null" || test "${image_entrypoint}" = "[]"
          test "$(docker inspect --format '{{json .Config.Volumes}}' philly-courts-scraper:ci)" = '{"/tmp":{}}'
          runtime_flags=(--rm --read-only --cap-drop ALL --tmpfs "/tmp:rw,nosuid,nodev,noexec,mode=1777,size=512m")
          inspection_runtime_flags=(--rm --read-only --network none --tmpfs "/tmp:rw,nosuid,nodev,noexec,mode=1777,size=512m")
          test "$(docker run "${runtime_flags[@]}" philly-courts-scraper:ci sh -c 'printf %s "$HOME"')" = "/tmp/app-home"
          docker run "${runtime_flags[@]}" philly-courts-scraper:ci python -c "import importlib.metadata as m, sys; assert sys.version_info >= (3, 13), sys.version; assert m.version('playwright') == '1.62.0'"
          test "$(docker run "${runtime_flags[@]}" philly-courts-scraper:ci google-chrome --product-version)" = "${chrome_product_version}"
          docker run "${runtime_flags[@]}" philly-courts-scraper:ci sh -ceu 'test ! -e /opt/google/chrome/chrome-sandbox; test ! -e /ms-playwright; test ! -e /usr/bin/pebble; test ! -e /etc/apt/sources.list.d/google-chrome.list; test ! -e /etc/cron.daily/google-chrome; test ! -e /etc/default/google-chrome; test ! -e /usr/share/keyrings/google-linux-signing-keyring.gpg; test ! -e /opt/google/chrome/cron'
          docker run "${runtime_flags[@]}" philly-courts-scraper:ci sh -ceu 'test -x /bin/false'
          if docker run "${runtime_flags[@]}" philly-courts-scraper:ci /bin/false; then
            echo "/bin/false unexpectedly returned success" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          # Inspect as root so owner-only directories cannot hide privileged
          # modes; read-only root and no network contain this inspection.
          docker run "${inspection_runtime_flags[@]}" --user root philly-courts-scraper:ci sh -ceu 'privileged_paths="$(find / -xdev -type f -perm /6000 -print)"; test -z "$privileged_paths"'
          docker run "${runtime_flags[@]}" philly-courts-scraper:ci gv-dashboard-etl --help
          docker run "${runtime_flags[@]}" philly-courts-scraper:ci gv-dashboard-etl courts monitor --help
          # Match Fargate's default outer security profile: only Chrome's nested
          # sandbox is disabled for this courts browser launch.
          docker run "${runtime_flags[@]}" philly-courts-scraper:ci python -c "from playwright.sync_api import sync_playwright; context = sync_playwright().start(); browser = context.chromium.launch(headless=True, channel='chrome', chromium_sandbox=False); assert browser.version == '${chrome_product_version}', browser.version; browser.close(); context.stop()"
      - name: Generate SBOMs and scan the exact production image
        working-directory: packages/aws-batch-scraper
        run: |
          set -euo pipefail
          chrome_lock="${GITHUB_WORKSPACE}/packages/etl/chrome-lock.json"
          chrome_package_version="$(jq -er '.package.version' "${chrome_lock}")"
          chrome_executable_sha256="$(jq -er '.executable.sha256' "${chrome_lock}")"
          uv run aws-batch-scraper-release-image scan-local-image \
            --image philly-courts-scraper:ci \
            --expected-distro-name ubuntu \
            --expected-distro-version 26.04 \
            --required-packages "python:playwright=1.62.0,deb:google-chrome-stable=${chrome_package_version},deb:libcurl3t64-gnutls=8.18.0-1ubuntu2.4,binary:node=24.18.1" \
            --required-chrome-executable-sha256 "sha256:${chrome_executable_sha256}" \
            --forbid-chrome-sandbox \
            --forbid-setuid-setgid-files \
            --output-directory "${RUNNER_TEMP}/scraper-image-scan"
      - name: Preserve scraper SBOM and vulnerability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scraper-image-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scraper-image-scan
          if-no-files-found: ignore
          retention-days: 30

  gate:
    name: ETL quality gate
    needs: [changes, etl, dashboard, scraper, image]
    if: always()
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      ETL_SELECTED: ${{ needs.changes.outputs.etl }}
      DASHBOARD_SELECTED: ${{ needs.changes.outputs.dashboard }}
      SCRAPER_SELECTED: ${{ needs.changes.outputs.scraper }}
      IMAGE_SELECTED: ${{ needs.changes.outputs.image }}
      ETL_RESULT: ${{ needs.etl.result }}
      DASHBOARD_RESULT: ${{ needs.dashboard.result }}
      SCRAPER_RESULT: ${{ needs.scraper.result }}
      IMAGE_RESULT: ${{ needs.image.result }}
    steps:
      - name: Require every selected job to pass
        run: |
          test "${CHANGES_RESULT}" = "success"
          require_routed_job() {
            case "$1" in
              true) test "$2" = "success" ;;
              false) test "$2" = "skipped" ;;
              *) echo "Invalid $3 selector: $1" >&2; exit 1 ;;
            esac
          }
          require_routed_job "${ETL_SELECTED}" "${ETL_RESULT}" "etl"
          require_routed_job "${DASHBOARD_SELECTED}" "${DASHBOARD_RESULT}" "dashboard"
          require_routed_job "${SCRAPER_SELECTED}" "${SCRAPER_RESULT}" "scraper"
          require_routed_job "${IMAGE_SELECTED}" "${IMAGE_RESULT}" "image"
