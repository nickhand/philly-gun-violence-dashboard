name: ETL quality

on:
  workflow_dispatch:
  # Emit a final gate on every PR; job routing keeps unrelated changes cheap.
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/etl/**"
      - "packages/dashboard-utils/**"
      - "packages/aws-batch-scraper/**"
      - ".dockerignore"
      - "Justfile"
      - "ruff.toml"
      - "ty.toml"
      - "uv.toml"
      - ".github/workflows/chrome-update.yml"
      - ".github/workflows/daily-homicide-sync.yml"
      - ".github/workflows/etl-quality.yml"
      - ".github/workflows/scraper-image-quality.yml"
      - ".github/workflows/production-smoke.yml"
      - ".github/ci/scope.py"

concurrency:
  group: etl-quality-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Route ETL quality jobs
    runs-on: ubuntu-24.04
    outputs:
      etl: ${{ steps.scope.outputs.etl }}
      dashboard: ${{ steps.scope.outputs.dashboard }}
      scraper: ${{ steps.scope.outputs.scraper }}
      image: ${{ steps.scope.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/ci/scope.py \
            --workflow etl \
            --event "${GITHUB_EVENT_NAME}" \
            --before "${BEFORE_SHA}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  etl:
    name: ETL tests and static checks
    needs: changes
    if: needs.changes.outputs.etl == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/etl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.12.0"
      - name: Ruff lint
        run: uv run --group dev ruff check src tests scripts
      - name: Ruff format
        run: uv run --group dev ruff format --check src tests scripts
      - name: ty
        run: uv run --group dev ty check --config-file ../../ty.toml --error-on-warning --output-format github src scripts
      - name: Tests
        run: uv run --group dev pytest tests

  dashboard:
    name: Dashboard utilities tests and static checks
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/dashboard-utils
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.12.0"
      - name: Ruff lint
        run: uv run --group dev ruff check src tests
      - name: Ruff format
        run: uv run --group dev ruff format --check src tests
      - name: ty
        run: uv run --group dev ty check --config-file ../../ty.toml --error-on-warning --output-format github src
      - name: Tests
        run: uv run --group dev pytest tests

  scraper:
    name: AWS Batch scraper tests and static checks
    needs: changes
    if: needs.changes.outputs.scraper == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/aws-batch-scraper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.12.0"
      - name: Ruff lint
        run: uv run --group dev ruff check src tests
      - name: Ruff format
        run: uv run --group dev ruff format --check src tests
      - name: ty
        run: uv run --group dev ty check --config-file ../../ty.toml --error-on-warning --output-format github src
      - name: Tests
        run: uv run --group dev pytest tests

  image:
    name: Scraper production image smoke and scan
    needs: [changes, etl, dashboard, scraper]
    if: >-
      always() &&
      needs.changes.outputs.image == 'true' &&
      (needs.etl.result == 'success' || needs.etl.result == 'skipped') &&
      (needs.dashboard.result == 'success' || needs.dashboard.result == 'skipped') &&
      (needs.scraper.result == 'success' || needs.scraper.result == 'skipped')
    uses: ./.github/workflows/scraper-image-quality.yml

  gate:
    name: ETL quality gate
    needs: [changes, etl, dashboard, scraper, image]
    if: always()
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      ETL_SELECTED: ${{ needs.changes.outputs.etl }}
      DASHBOARD_SELECTED: ${{ needs.changes.outputs.dashboard }}
      SCRAPER_SELECTED: ${{ needs.changes.outputs.scraper }}
      IMAGE_SELECTED: ${{ needs.changes.outputs.image }}
      ETL_RESULT: ${{ needs.etl.result }}
      DASHBOARD_RESULT: ${{ needs.dashboard.result }}
      SCRAPER_RESULT: ${{ needs.scraper.result }}
      IMAGE_RESULT: ${{ needs.image.result }}
    steps:
      - name: Require every selected job to pass
        run: |
          test "${CHANGES_RESULT}" = "success"
          require_routed_job() {
            case "$1" in
              true) test "$2" = "success" ;;
              false) test "$2" = "skipped" ;;
              *) echo "Invalid $3 selector: $1" >&2; exit 1 ;;
            esac
          }
          require_routed_job "${ETL_SELECTED}" "${ETL_RESULT}" "etl"
          require_routed_job "${DASHBOARD_SELECTED}" "${DASHBOARD_RESULT}" "dashboard"
          require_routed_job "${SCRAPER_SELECTED}" "${SCRAPER_RESULT}" "scraper"
          require_routed_job "${IMAGE_SELECTED}" "${IMAGE_RESULT}" "image"
