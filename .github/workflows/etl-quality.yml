name: ETL quality

on:
  pull_request:
    paths:
      - "packages/etl/**"
      - "packages/dashboard-utils/**"
      - "packages/aws-batch-scraper/**"
      - ".dockerignore"
      - "Justfile"
      - "ty.toml"
      - "uv.toml"
      - "just/python.just"
      - ".github/workflows/courts-scrape.yml"
      - ".github/workflows/courts-process.yml"
      - ".github/workflows/daily-homicide-sync.yml"
      - ".github/workflows/daily-shootings-sync.yml"
      - ".github/workflows/production-smoke.yml"
      - ".github/workflows/etl-quality.yml"
  push:
    branches: [main]
    paths:
      - "packages/etl/**"
      - "packages/dashboard-utils/**"
      - "packages/aws-batch-scraper/**"
      - ".dockerignore"
      - "Justfile"
      - "ty.toml"
      - "uv.toml"
      - "just/python.just"
      - ".github/workflows/courts-scrape.yml"
      - ".github/workflows/courts-process.yml"
      - ".github/workflows/daily-homicide-sync.yml"
      - ".github/workflows/daily-shootings-sync.yml"
      - ".github/workflows/production-smoke.yml"
      - ".github/workflows/etl-quality.yml"

concurrency:
  group: etl-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ETL tests and static checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/etl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.0"
      - name: Audit ETL production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-local --output-file "${RUNNER_TEMP}/etl-requirements.txt"
          uvx --from "pip-audit==2.10.1" pip-audit --requirement "${RUNNER_TEMP}/etl-requirements.txt" --disable-pip --progress-spinner off --strict
      - name: Audit dashboard utilities production dependencies
        working-directory: packages/dashboard-utils
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-local --output-file "${RUNNER_TEMP}/dashboard-utils-requirements.txt"
          uvx --from "pip-audit==2.10.1" pip-audit --requirement "${RUNNER_TEMP}/dashboard-utils-requirements.txt" --disable-pip --progress-spinner off --strict
      - name: Audit AWS Batch scraper production dependencies
        working-directory: packages/aws-batch-scraper
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-local --output-file "${RUNNER_TEMP}/aws-batch-scraper-requirements.txt"
          uvx --from "pip-audit==2.10.1" pip-audit --requirement "${RUNNER_TEMP}/aws-batch-scraper-requirements.txt" --disable-pip --progress-spinner off --strict
      - name: ETL Ruff lint
        run: uv run --group dev ruff check src tests
      - name: ETL Ruff format
        run: uv run --group dev ruff format --check src tests
      - name: ETL ty
        run: uv run --group dev ty check --config-file ../../ty.toml --error-on-warning --output-format github src
      - name: ETL tests
        run: uv run --group dev pytest tests
      - name: Dashboard utilities Ruff lint
        working-directory: packages/dashboard-utils
        run: uv run --group dev ruff check src tests
      - name: Dashboard utilities Ruff format
        working-directory: packages/dashboard-utils
        run: uv run --group dev ruff format --check src tests
      - name: Dashboard utilities ty
        working-directory: packages/dashboard-utils
        run: uv run --group dev ty check --config-file ../../ty.toml --error-on-warning --output-format github src
      - name: Dashboard utilities tests
        working-directory: packages/dashboard-utils
        run: uv run --group dev pytest tests
      - name: AWS Batch scraper Ruff lint
        working-directory: packages/aws-batch-scraper
        run: uv run --group dev ruff check src tests
      - name: AWS Batch scraper Ruff format
        working-directory: packages/aws-batch-scraper
        run: uv run --group dev ruff format --check src tests
      - name: AWS Batch scraper ty
        working-directory: packages/aws-batch-scraper
        run: uv run --group dev ty check --config-file ../../ty.toml --error-on-warning --output-format github src
      - name: AWS Batch scraper tests
        working-directory: packages/aws-batch-scraper
        run: uv run --group dev pytest tests
      - name: Verify pinned Chrome is still the signed stable release
        run: uv run python -m etl.chrome_release
      - name: Build production scraper image
        working-directory: .
        run: docker build --file packages/etl/Dockerfile --tag philly-courts-scraper:ci .
      - name: Smoke-test production scraper image
        working-directory: .
        run: |
          test "$(docker inspect --format '{{.Config.User}}' philly-courts-scraper:ci)" = "app"
          test "$(docker inspect --format '{{json .Config.Cmd}}' philly-courts-scraper:ci)" = '["gv-dashboard-etl","courts","worker"]'
          image_entrypoint="$(docker inspect --format '{{json .Config.Entrypoint}}' philly-courts-scraper:ci)"
          test "${image_entrypoint}" = "null" || test "${image_entrypoint}" = "[]"
          test "$(docker inspect --format '{{json .Config.Volumes}}' philly-courts-scraper:ci)" = '{"/tmp":{}}'
          runtime_flags=(--rm --read-only --cap-drop ALL --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=1777,size=512m)
          inspection_runtime_flags=(--rm --read-only --network none --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=1777,size=512m)
          test "$(docker run "${runtime_flags[@]}" philly-courts-scraper:ci sh -c 'printf %s "$HOME"')" = "/tmp/app-home"
          docker run "${runtime_flags[@]}" philly-courts-scraper:ci python -c "import importlib.metadata as m, sys; assert sys.version_info >= (3, 13), sys.version; assert m.version('playwright') == '1.62.0'"
          test "$(docker run "${runtime_flags[@]}" philly-courts-scraper:ci google-chrome --product-version)" = "151.0.7922.169"
          docker run "${runtime_flags[@]}" philly-courts-scraper:ci sh -ceu 'test ! -e /opt/google/chrome/chrome-sandbox; test ! -e /ms-playwright; test ! -e /usr/bin/pebble; test ! -e /etc/apt/sources.list.d/google-chrome.list; test ! -e /etc/cron.daily/google-chrome; test ! -e /etc/default/google-chrome; test ! -e /usr/share/keyrings/google-linux-signing-keyring.gpg; test ! -e /opt/google/chrome/cron'
          docker run "${runtime_flags[@]}" philly-courts-scraper:ci sh -ceu 'test -x /bin/false'
          if docker run "${runtime_flags[@]}" philly-courts-scraper:ci /bin/false; then
            echo "/bin/false unexpectedly returned success" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          # Inspect as root so owner-only directories cannot hide privileged
          # modes; read-only root and no network contain this inspection.
          docker run "${inspection_runtime_flags[@]}" --user root philly-courts-scraper:ci sh -ceu 'privileged_paths="$(find / -xdev -type f -perm /6000 -print)"; test -z "$privileged_paths"'
          docker run "${runtime_flags[@]}" philly-courts-scraper:ci gv-dashboard-etl --help
          docker run "${runtime_flags[@]}" philly-courts-scraper:ci gv-dashboard-etl courts monitor --help
          # Match Fargate's default outer security profile: only Chrome's nested
          # sandbox is disabled for this courts browser launch.
          docker run "${runtime_flags[@]}" philly-courts-scraper:ci python -c "from playwright.sync_api import sync_playwright; context = sync_playwright().start(); browser = context.chromium.launch(headless=True, channel='chrome', chromium_sandbox=False); assert browser.version == '151.0.7922.169', browser.version; browser.close(); context.stop()"
      - name: Generate SBOMs and scan the exact production image
        working-directory: packages/aws-batch-scraper
        run: |
          uv run aws-batch-scraper-release-image scan-local-image \
            --image philly-courts-scraper:ci \
            --expected-distro-name ubuntu \
            --expected-distro-version 26.04 \
            --required-packages "python:playwright=1.62.0,deb:google-chrome-stable=151.0.7922.169-1,binary:node=24.18.1" \
            --required-chrome-executable-sha256 "sha256:3059e7448d906793a7116351739d3096d232d1516e8bf19209b1e2957d5e7662" \
            --forbid-chrome-sandbox \
            --forbid-setuid-setgid-files \
            --output-directory "${RUNNER_TEMP}/scraper-image-scan"
      - name: Preserve scraper SBOM and vulnerability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scraper-image-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scraper-image-scan
          if-no-files-found: ignore
          retention-days: 30
