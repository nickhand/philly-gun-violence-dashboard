name: Batch Courts Scraper ETL

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Number of incident keys to scrape. Use 0 for all incidents."
        type: number
        required: false
        default: 0
      seed:
        description: "Random seed used when sampling incident keys."
        type: number
        required: false
        default: 42
      allow_recent_full_run:
        description: "Explicitly bypass the 24-hour full-run duplicate guard."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: courts-production
  cancel-in-progress: false

jobs:
  batch-courts-scraper:
    name: Batch Courts Scraper
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate sample input
        env:
          ALLOW_RECENT_FULL_RUN: ${{ inputs.allow_recent_full_run }}
          SAMPLE: ${{ inputs.sample }}
        run: |
          if ! [[ "$SAMPLE" =~ ^[0-9]+$ ]]; then
            echo "sample must be an integer greater than or equal to 0" >&2
            exit 1
          fi
          if [[ "$ALLOW_RECENT_FULL_RUN" != "true" && "$ALLOW_RECENT_FULL_RUN" != "false" ]]; then
            echo "allow_recent_full_run must be a boolean" >&2
            exit 1
          fi
          if [[ "$SAMPLE" -gt 0 && "$ALLOW_RECENT_FULL_RUN" == "true" ]]; then
            echo "allow_recent_full_run is valid only when sample=0 selects a full run" >&2
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::985454606291:role/gha-ujs-scraper
          aws-region: us-east-1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"
      - name: Verify identity
        run: aws sts get-caller-identity
      - name: Run courts ETL
        run: |
          cd packages/etl
          uv run gv-dashboard-etl courts smoke --skip-portal
          submit_args=(--force --monitor-in-ecs)
          if [ "$ALLOW_RECENT_FULL_RUN" = "true" ]; then
            submit_args+=(--allow-recent-full-run)
          fi
          if [ "${SAMPLE}" -gt 0 ]; then
            uv run gv-dashboard-etl courts submit \
              "${submit_args[@]}" \
              --sample "${SAMPLE}" \
              --seed "${SEED}"
          else
            uv run gv-dashboard-etl courts submit "${submit_args[@]}"
          fi
        env:
          ALLOW_RECENT_FULL_RUN: ${{ inputs.allow_recent_full_run }}
          SAMPLE: ${{ inputs.sample }}
          SEED: ${{ inputs.seed }}
          ENV: prod
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_SCRAPER_PREFIX: ${{ vars.S3_SCRAPER_PREFIX }}
          S3_PROCESSED_PREFIX: ${{ vars.S3_PROCESSED_PREFIX }}
          S3_REFERENCE_PREFIX: ${{ vars.S3_REFERENCE_PREFIX }}
          SQS_QUEUE_NAME: ${{ vars.SQS_QUEUE_NAME }}
          SQS_DLQ_NAME: ${{ vars.SQS_DLQ_NAME }}
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          # Exact digest-backed worker revision; must not contain monitor secrets.
          ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
          # Distinct exact monitor revision, permitted to receive the dispatch token.
          ECS_MONITOR_TASK_DEFINITION: ${{ vars.ECS_MONITOR_TASK_DEFINITION }}
          # Exact repository@sha256 URI printed only after local and ECR release gates pass.
          ECS_EXPECTED_IMAGE_URI: ${{ vars.ECS_EXPECTED_IMAGE_URI }}
          # Exact reviewed roles; task-definition substitution fails before queue mutation.
          ECS_EXPECTED_TASK_ROLE_ARN: ${{ vars.ECS_EXPECTED_TASK_ROLE_ARN }}
          ECS_EXPECTED_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXPECTED_EXECUTION_ROLE_ARN }}
          # Exact monitor-only secret and reviewed Fargate runtime contract.
          ECS_EXPECTED_MONITOR_SECRET_ARN: ${{ vars.ECS_EXPECTED_MONITOR_SECRET_ARN }}
          ECS_PLATFORM_VERSION: "1.4.0"
          ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
          ECS_TASK_COUNT: ${{ vars.ECS_TASK_COUNT }}
          ECS_SUBNET_IDS: ${{ vars.ECS_SUBNET_IDS }}
          ECS_SECURITY_GROUP_IDS: ${{ vars.ECS_SECURITY_GROUP_IDS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
