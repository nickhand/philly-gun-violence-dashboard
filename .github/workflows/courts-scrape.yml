name: Batch Courts Scraper ETL
on:
  schedule:
    - cron: "15 2 * * 0,2,4"
  push:
    paths:
      - .github/workflows/courts-scrape.yml

jobs:
  batch-courts-scraper:
    name: Batch Courts Scraper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v4
      - uses: taiki-e/install-action@just
      - name: Install Playwright Chromium
        run: uv run --project etl playwright install chromium --with-deps
      - name: Run courts ETL
        run: just etl-courts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ vars.AWS_BUCKET_NAME }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
      - name: Restart Fly API
        uses: superfly/flyctl-actions/setup-flyctl@master
      - run: just fly-restart
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
