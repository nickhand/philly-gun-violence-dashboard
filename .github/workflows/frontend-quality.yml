name: Frontend quality

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-quality.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-quality.yml"
  schedule:
    - cron: "30 9 * * 1"

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Type, build, and unit coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run type-check
      - run: npm run type-check:nuxt
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run build:nuxt
      - run: npm run test:nuxt:seo
      - run: npm run build:nuxt:cloudflare
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  browser-family:
    name: Browser family tests (${{ matrix.browser }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One job per browser family avoids repeated browser and apt installs.
    # Playwright does not recommend caching browsers because Linux system
    # dependencies are not cacheable and cache restores take similar time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            legacy_projects: "--project=chromium --project=mobile-chrome"
            nuxt_projects: "--project=nuxt-chromium --project=nuxt-mobile-chrome"
            lighthouse: true
          - browser: firefox
            legacy_projects: "--project=firefox"
            nuxt_projects: "--project=nuxt-firefox-core"
            lighthouse: false
          - browser: webkit
            legacy_projects: "--project=webkit"
            nuxt_projects: "--project=nuxt-webkit-core"
            lighthouse: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Install ${{ matrix.browser }} and system dependencies
        id: install
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run legacy browser tests
        run: npx playwright test ${{ matrix.legacy_projects }}
      - name: Run Nuxt browser tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright test --config=playwright.nuxt.config.ts ${{ matrix.nuxt_projects }}
      - name: Run Lighthouse performance checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.lighthouse }}
        run: npm run test:lighthouse
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-reports-${{ matrix.browser }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && matrix.lighthouse }}
        with:
          name: lighthouse-report
          path: frontend/lighthouse-report
          if-no-files-found: ignore
