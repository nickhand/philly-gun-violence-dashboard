[project]
name = "simple-scraper"
version = "0.1.0"
description = "Minimal aws-batch-scraper example"
requires-python = ">=3.13"
dependencies = ["aws-batch-scraper"]

[project.scripts]
simple-scraper = "simple_scraper.cli:app"

# Permit the reviewed certificate revocation update without a cooling-off delay.
[tool.uv]
exclude-newer-package = { certifi = false }

[tool.uv.sources]
aws-batch-scraper = { path = "../..", editable = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
