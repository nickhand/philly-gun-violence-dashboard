[project]
name = "aws-batch-scraper"
version = "0.1.0"
description = "Generic AWS batch scraper framework: SQS → Fargate → S3"
readme = "README.md"
authors = [{ name = "Nick Hand", email = "nicholas.adam.hand@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.4",
    "boto3-stubs[ecs,sqs,s3]>=1.42.19",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "tenacity>=8.2.3",
    "typer>=0.20.0",
]

[project.scripts]
aws-batch-scraper-release-image = "aws_batch_scraper.release_image:main"

[tool.uv]
exclude-newer = "1 week"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.10",
    "ty==0.0.69",
]
