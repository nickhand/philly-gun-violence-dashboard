[project]
name = "api"
version = "0.1.0"
description = "API for Philadelphia Gun Violence Dashboard"
readme = "README.md"
authors = [{ name = "Nick Hand", email = "nicholas.adam.hand@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["fastapi>=0.127.0", "uvicorn>=0.40.0", "dashboard-utils"]

[tool.uv]
exclude-newer = "1 week"
# Apply the reviewed certificate and OpenTelemetry security releases immediately.
exclude-newer-package = { certifi = false, opentelemetry-api = false }
# Keep independent locks above the reviewed shared security floor.
constraint-dependencies = ["urllib3>=2.8.0", "certifi>=2026.10.23", "opentelemetry-api>=1.45.1"]

[tool.uv.sources]
dashboard-utils = { path = "../dashboard-utils", editable = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.0.3",
    "ruff>=0.14.10",
    "ty==0.0.84",
]

[tool.uv.build-backend]
module-name = "app"
module-root = ""
