<!doctype html>
<html>
  <head>
    <title>UJS Portal - Case Search</title>
  </head>
  <body>
    <div class="landing-page">
      <h1>Pennsylvania Unified Judicial System</h1>
      <h2>Case Search</h2>
      <form id="caseSearchForm">
        <div id="SearchBy-Control">
          <select>
            <option>Incident Number</option>
            <option>Docket Number</option>
          </select>
        </div>
        <div id="IncidentNumber-Control">
          <input type="text" placeholder="Enter incident number" />
        </div>
        <button id="btnSearch" type="submit">Search</button>
      </form>
      <div class="session-message">
        Your session has expired. Please start a new search.
      </div>
    </div>
  </body>
</html>
