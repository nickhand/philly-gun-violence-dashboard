[project]
name = "etl"
version = "0.1.0"
description = "Python ETL toolkit for Philadelphia Gun Violence Dashboard"
readme = "README.md"
authors = [{ name = "Nick Hand", email = "nicholas.adam.hand@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "arcgis2geojson>=3.1.1",
    "geopandas>=1.1.1",
    "httpx>=0.28.1",
    "justhtml>=0.16.0",
    "loguru>=0.7.3",
    "networkx>=3.6.1",
    "pandas>=2.3.3,<3",
    "playwright>=1.56.0",
    "pydantic>=2.12.5",
    "aws-batch-scraper",
    "dashboard-utils",
]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]
aws-batch-scraper = { path = "../aws-batch-scraper", editable = true }
dashboard-utils = { path = "../dashboard-utils", editable = true }

[project.scripts]
gv-dashboard-etl = "etl.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.8.0",
    "pandas-stubs>=2.3.3.251201",
    "pytest>=8.0.0",
    "ruff>=0.14.10",
    "ty==0.0.69",
    "types-geopandas>=1.1.1.20250829",
    "types-networkx>=3.6.1.20251212",
]
