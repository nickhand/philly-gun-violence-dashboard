[project]
name = "dashboard-utils"
version = "0.1.0"
description = "Python utilities for the Philadelphia Gun Violence Dashboard"
readme = "README.md"
authors = [{ name = "Nick Hand", email = "nicholas.adam.hand@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.4",
    "boto3-stubs[s3]>=1.42.19",
    "botocore[crt]>=1.42.17",
    "geopandas>=1.1.1",
    "loguru>=0.7.3",
    "pandas>=3.0.5,<4",
    "pandas-stubs>=2.3.3.251219",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
]

[tool.uv]
exclude-newer = "1 week"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.8.0",
    "pandas-stubs>=2.3.3.251201",
    "pytest>=9.1.1",
    "ruff>=0.14.8",
    "ty==0.0.69",
    "types-geopandas>=1.1.1.20250829",
]
