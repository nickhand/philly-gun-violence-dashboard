[build]
# Only frontend or Netlify configuration changes need a production deploy.
# Git's top-level pathspec keeps this correct whether Netlify's base directory
# is configured as the repository root or frontend/.
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':(top)frontend' ':(top)netlify.toml'"

[build.environment]
VITE_PUBLIC_BASE = "/philly-gun-violence-map/"

# Serve Vite-built assets when requested under the subpath
[[redirects]]
from = "/philly-gun-violence-map/assets/*"
to = "/assets/:splat"
status = 200

# Server-rendered statistics stay in sync with the API's loaded datasets and
# do not require a Netlify production deploy after ETL runs.
[[redirects]]
from = "/philly-gun-violence-map/stats"
to = "https://philly-gun-violence-dashboard-api.fly.dev/stats"
status = 200
force = true

[[redirects]]
from = "/philly-gun-violence-map/stats/"
to = "https://philly-gun-violence-dashboard-api.fly.dev/stats"
status = 200
force = true

# www.nickhand.dev mounts this Netlify site below /philly-gun-violence-map
# and strips that prefix before forwarding. Keep root aliases for that proxy.
[[redirects]]
from = "/stats"
to = "https://philly-gun-violence-dashboard-api.fly.dev/stats"
status = 200
force = true

[[redirects]]
from = "/stats/"
to = "https://philly-gun-violence-dashboard-api.fly.dev/stats"
status = 200
force = true

# About page snapshot: same app bundle as index.html but with About-specific
# meta tags and crawler summary. The SPA still boots for visitors.
[[redirects]]
from = "/philly-gun-violence-map/about"
to = "/about/index.html"
status = 200

[[redirects]]
from = "/philly-gun-violence-map/about/"
to = "/about/index.html"
status = 200

# Keep sitemap freshness tied to the loaded datasets too.
[[redirects]]
from = "/philly-gun-violence-map/sitemap.xml"
to = "https://philly-gun-violence-dashboard-api.fly.dev/sitemap.xml"
status = 200
force = true

[[redirects]]
from = "/sitemap.xml"
to = "https://philly-gun-violence-dashboard-api.fly.dev/sitemap.xml"
status = 200
force = true

# Other static SEO files must resolve under the subpath on the canonical
# domain (www.nickhand.dev proxies this path here); without these the SPA
# fallback would return index.html for them.

[[redirects]]
from = "/philly-gun-violence-map/robots.txt"
to = "/robots.txt"
status = 200

[[redirects]]
from = "/philly-gun-violence-map/llms.txt"
to = "/llms.txt"
status = 200

[[redirects]]
from = "/philly-gun-violence-map/og-image.png"
to = "/og-image.png"
status = 200

# SPA fallback for history-mode routes under the subpath
[[redirects]]
from = "/philly-gun-violence-map/*"
to = "/index.html"
status = 200
