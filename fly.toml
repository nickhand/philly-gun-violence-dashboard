app = "philly-gun-violence-dashboard-api"
primary_region = "iad"

[build]
dockerfile = "packages/api/Dockerfile"

[env]
PORT = "8080"
ENV = "prod"

[http_service]
internal_port = 8080
force_https = true
min_machines_running = 1
processes = ["app"]   

[[vm]]
size = "shared-cpu-1x"
# Atomic rollover briefly retains the serving snapshot while validating a new
# current/N-1 candidate. Keep explicit headroom for geospatial indexes, S3
# clients, and response serialization; measure production RSS before reducing.
memory = "1gb"

[[http_service.checks]]
grace_period = "30s"
interval = "15s"
method = "GET"
path = "/health"
timeout = "5s"

[processes]
app = "uvicorn app.main:app --host 0.0.0.0 --port 8080"
