<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3136"/>
      <stop offset="100%" style="stop-color:#1e2428"/>
    </linearGradient>
    
    <!-- Map gradient overlay -->
    <linearGradient id="mapOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a4449;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#2a3136;stop-opacity:0.95"/>
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a7080"/>
      <stop offset="100%" style="stop-color:#7ab5e5"/>
    </linearGradient>
    
    <!-- Chart bar gradient -->
    <linearGradient id="barGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#5a8a9a"/>
      <stop offset="100%" style="stop-color:#7ab5e5"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Simplified Philadelphia map outline (stylized) -->
  <g transform="translate(650, 80)" opacity="0.15">
    <path d="M 180 0 L 280 30 L 320 80 L 350 150 L 380 250 L 370 350 L 320 420 L 250 450 L 150 440 L 80 400 L 30 320 L 0 220 L 20 120 L 60 50 L 120 10 Z" 
          fill="none" stroke="#7ab5e5" stroke-width="3"/>
    <!-- Grid lines -->
    <line x1="0" y1="150" x2="380" y2="150" stroke="#7ab5e5" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="300" x2="380" y2="300" stroke="#7ab5e5" stroke-width="1" opacity="0.5"/>
    <line x1="120" y1="0" x2="120" y2="450" stroke="#7ab5e5" stroke-width="1" opacity="0.5"/>
    <line x1="240" y1="0" x2="240" y2="450" stroke="#7ab5e5" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Data points on map (stylized shooting locations) -->
  <g transform="translate(650, 80)" opacity="0.6">
    <circle cx="150" cy="180" r="6" fill="#e57373"/>
    <circle cx="200" cy="220" r="5" fill="#e57373"/>
    <circle cx="180" cy="280" r="7" fill="#e57373"/>
    <circle cx="250" cy="200" r="4" fill="#e57373"/>
    <circle cx="120" cy="250" r="6" fill="#e57373"/>
    <circle cx="280" cy="300" r="5" fill="#e57373"/>
    <circle cx="100" cy="320" r="4" fill="#e57373"/>
    <circle cx="220" cy="350" r="6" fill="#e57373"/>
    <circle cx="170" cy="150" r="5" fill="#e57373"/>
    <circle cx="300" cy="250" r="4" fill="#e57373"/>
    <circle cx="140" cy="380" r="5" fill="#e57373"/>
    <circle cx="230" cy="120" r="4" fill="#e57373"/>
  </g>
  
  <!-- Main title -->
  <text x="80" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#ffffff">
    Philadelphia
  </text>
  <text x="80" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#ffffff">
    Gun Violence
  </text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#7ab5e5">
    Dashboard
  </text>
  
  <!-- Subtitle -->
  <text x="80" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="rgba(255,255,255,0.7)">
    Interactive map &amp; data visualization
  </text>
  
  <!-- Accent line -->
  <rect x="80" y="385" width="120" height="4" rx="2" fill="url(#accentGradient)"/>
  
  <!-- Stats boxes -->
  <g transform="translate(80, 420)">
    <!-- Daily updates badge -->
    <rect x="0" y="0" width="160" height="50" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="80" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">UPDATED</text>
    <text x="80" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Daily</text>
    
    <!-- Open Data badge -->
    <rect x="175" y="0" width="160" height="50" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="255" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">SOURCE</text>
    <text x="255" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Open Data</text>
    
    <!-- Interactive badge -->
    <rect x="350" y="0" width="160" height="50" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="430" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">FEATURES</text>
    <text x="430" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Interactive</text>
  </g>
  
  <!-- Mini bar chart visualization -->
  <g transform="translate(80, 510)">
    <rect x="0" y="30" width="30" height="70" rx="4" fill="url(#barGradient)" opacity="0.8"/>
    <rect x="40" y="50" width="30" height="50" rx="4" fill="url(#barGradient)" opacity="0.8"/>
    <rect x="80" y="20" width="30" height="80" rx="4" fill="url(#barGradient)" opacity="0.8"/>
    <rect x="120" y="40" width="30" height="60" rx="4" fill="url(#barGradient)" opacity="0.8"/>
    <rect x="160" y="55" width="30" height="45" rx="4" fill="url(#barGradient)" opacity="0.8"/>
    <rect x="200" y="35" width="30" height="65" rx="4" fill="url(#barGradient)" opacity="0.8"/>
    <rect x="240" y="45" width="30" height="55" rx="4" fill="url(#barGradient)" opacity="0.8"/>
    <rect x="280" y="60" width="30" height="40" rx="4" fill="url(#barGradient)" opacity="0.8"/>
  </g>
  
  <!-- URL -->
  <text x="1120" y="590" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="end">
    phillygunviolence.netlify.app
  </text>
  
  <!-- Border accent -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGradient)"/>
</svg>
