[project]
name = "etl"
version = "0.1.0"
description = "Python ETL toolkit for Philadelphia Gun Violence Dashboard"
readme = "README.md"
authors = [{ name = "Nick Hand", email = "nicholas.adam.hand@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "arcgis2geojson>=3.1.1",
    "boto3>=1.42.4",
    "geopandas>=1.1.1",
    "httpx>=0.28.1",
    "justhtml>=0.16.0",
    "loguru>=0.7.3",
    "networkx>=3.6.1",
    "pandas>=2.3.3",
    "playwright>=1.56.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "typer>=0.20.0",
    "tenacity>=8.2.3",
    "s3fs>=2021.7.0",
    "simplejson>=3.20.2",
]

[project.scripts]
gv-dashboard-etl = "etl.cli:app"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.8.0",
    "jupyterlab>=4.5.0",
    "matplotlib>=3.10.7",
    "mypy>=1.19.0",
    "pandas-stubs>=2.3.3.251201",
    "ruff>=0.14.8",
    "types-geopandas>=1.1.1.20250829",
    "types-networkx>=3.6.1.20251212",
]
